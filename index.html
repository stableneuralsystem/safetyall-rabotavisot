<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety ALL - Обучающая платформа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
    /* --- НАСТРОЙКИ ДИЗАЙНА --- */
    :root {
        --primary-blue: #3b82f6;
        --bg-dark: #0f172a;
        --glass-bg: rgba(15, 23, 42, 0.85);
        --glass-border: rgba(255, 255, 255, 0.1);
        --text-color: #ffffff;
    }

    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: 'Oswald', sans-serif;
        background-color: var(--bg-dark);
        background-image: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                          radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
        color: var(--text-color);
        overflow-x: hidden;
    }

    /* Утилиты */
    .hidden { display: none !important; }
    .fade-in { animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes subtleGlow {
        0% { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); border-color: rgba(255,255,255,0.1); }
        50% { box-shadow: 0 25px 50px -12px rgba(59, 130, 246, 0.25); border-color: rgba(59, 130, 246, 0.3); }
        100% { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); border-color: rgba(255,255,255,0.1); }
    }

    /* --- НОВЫЕ СТИЛИ ДЛЯ БЛОКОВ И КНОПОК --- */

    /* Пульсирующая неоновая рамка для блоков */
    @keyframes neonBorderPulse {
        0%, 100% {
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.1), inset 0 0 5px rgba(59, 130, 246, 0.1);
        }
        50% {
            border-color: rgba(59, 130, 246, 1);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.5), inset 0 0 10px rgba(59, 130, 246, 0.3);
        }
    }

    /* "Дышащий" свет для стеклянных кнопок */
    @keyframes neonButtonBreathing {
        0%, 100% {
            box-shadow: inset 2px 2px 5px rgba(255, 255, 255, 0.1), inset -2px -2px 5px rgba(0, 0, 0, 0.3), 0 5px 10px rgba(59, 130, 246, 0.2);
            color: #e2e8f0;
            border-color: rgba(255, 255, 255, 0.2);
        }
        50% {
            box-shadow: inset 2px 2px 5px rgba(255, 255, 255, 0.2), inset -2px -2px 5px rgba(0, 0, 0, 0.5), 0 5px 25px rgba(59, 130, 246, 0.6);
            color: #ffffff;
            text-shadow: 0 0 8px rgba(59, 130, 246, 0.8);
            border-color: rgba(59, 130, 246, 0.6);
        }
    }

    /* Стилизация блоков категорий */
    .menu-section {
        border: 2px solid var(--primary-blue);
        border-radius: 20px;
        padding: 25px 20px;
        margin-bottom: 25px;
        position: relative;
        background: rgba(15, 23, 42, 0.3);
        animation: neonBorderPulse 4s infinite ease-in-out;
    }

    .section-heading {
        position: absolute;
        top: -12px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--bg-dark);
        padding: 0 15px;
        font-size: 0.9rem;
        color: #3b82f6;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 500;
        white-space: nowrap;
    }

    /* Стилизация новых 3D стеклянных кнопок */
    .btn-neon-3d {
        /* Стеклянная база */
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        
        /* 3D эффект и тени */
        box-shadow: 
            inset 2px 2px 5px rgba(255, 255, 255, 0.1),
            inset -2px -2px 5px rgba(0, 0, 0, 0.3),
            0 5px 15px rgba(0,0,0,0.3);
        
        /* Анимация дыхания */
        animation: neonButtonBreathing 5s infinite ease-in-out;
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
    }

    .btn-neon-3d:hover {
        transform: translateY(-3px);
        animation-duration: 2s; /* Ускоряем дыхание при наведении */
    }

    /* Эффект блика на стекле */
    .btn-neon-3d::before {
        content: '';
        position: absolute;
        top: 0;
        left: -75%;
        width: 50%;
        height: 100%;
        background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
        transform: skewX(-25deg);
        transition: 0.7s;
    }

    .btn-neon-3d:hover::before {
        left: 125%;
    }


    /* --- СТРУКТУРА ЭКРАНОВ --- */
    .screen {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        box-sizing: border-box;
    }

    /* Карточка */
    .glass-card {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        border-radius: 28px;
        padding: 60px 40px;
        text-align: center;
        max-width: 420px;
        width: 100%;
        position: relative;
        z-index: 2;
        animation: subtleGlow 4s infinite ease-in-out; 
    }

    /* Типографика */
    h1 {
        font-size: 3.2rem;
        margin: 0;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 2px;
        line-height: 1;
        background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
    }

    .subtitle-blue {
        color: #3b82f6;
        font-size: 0.9rem;
        font-weight: 500;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 40px;
        display: block;
    }

    /* Поля ввода */
    input[type="password"] {
        width: 100%;
        padding: 18px;
        margin-bottom: 20px;
        box-sizing: border-box;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        color: white;
        font-family: 'Oswald', sans-serif;
        font-size: 1.1rem;
        text-align: center;
        outline: none;
        transition: 0.3s;
    }

    input[type="password"]:focus {
        border-color: var(--primary-blue);
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    /* --- КНОПКИ (Базовые стили) --- */
    .btn {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        padding: 18px;
        margin-bottom: 15px;
        box-sizing: border-box;
        font-family: 'Oswald', sans-serif;
        font-size: 1.1rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 14px;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.3s ease;
        border: none;
        color: white;
    }
    
    /* Старая кнопка primary (оставлена для входа) */
    .btn-primary {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
    }

    .btn-lang {
        background: rgba(30, 41, 59, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #e2e8f0;
        font-weight: 500;
        justify-content: flex-start;
        padding-left: 30px;
        position: relative;
    }

    .btn-lang:hover {
        background: rgba(59, 130, 246, 0.1);
        border-color: rgba(59, 130, 246, 0.5);
        transform: translateY(-2px);
    }

    .flag-icon {
        margin-right: 15px;
        font-size: 1.2rem;
    }

    .btn-outline {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #94a3b8;
        font-size: 0.9rem;
    }
    .btn-outline:hover {
        border-color: var(--primary-blue);
        color: white;
        background: rgba(59, 130, 246, 0.1);
    }

    .error-msg {
        color: #f87171;
        margin-top: 15px;
        font-size: 0.9rem;
        display: none;
    }

    /* --- PDF КОНТЕЙНЕР --- */
    .pdf-container-wrapper {
        width: 95%;
        max-width: 1100px;
        height: 85vh;
        background: #1e293b;
        border-radius: 20px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        border: 1px solid var(--glass-border);
        display: flex;
        flex-direction: column;
        animation: subtleGlow 5s infinite ease-in-out;
    }

    .pdf-header {
        padding: 15px 25px;
        background: rgba(15, 23, 42, 0.9);
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--glass-border);
    }

    .pdf-title {
        font-size: 1.1rem;
        letter-spacing: 1px;
    }

    .close-btn {
        background: none;
        border: 1px solid rgba(255,255,255,0.2);
        color: white;
        padding: 6px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-family: 'Oswald', sans-serif;
        text-transform: uppercase;
        font-size: 0.85rem;
        transition: 0.2s;
    }
    
    .close-btn:hover {
        background: rgba(255,255,255,0.1);
        border-color: white;
    }

    .iframe-holder {
        flex-grow: 1;
        position: relative;
        background: #000;
    }

    .iframe-holder iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    .blocker {
        position: absolute;
        top: 0;
        right: 0;
        width: 80px;
        height: 80px;
        background: transparent;
        z-index: 100;
    }

</style>
</head>
<body>

    <div id="login-screen" class="screen">
        <div class="glass-card fade-in">
            <h1>Safety ALL</h1>
            <span class="subtitle-blue">ОБУЧАЮЩАЯ ПЛАТФОРМА</span>
            
            <div style="margin-top: 20px;">
                <input type="password" id="passwordInput" placeholder="ВВЕДИТЕ ПАРОЛЬ">
                <button class="btn btn-primary" onclick="login()">ВОЙТИ</button>
            </div>
            <div id="errorMsg" class="error-msg">Неверный пароль</div>
        </div>
    </div>

    <div id="lang-screen" class="screen hidden">
        <div class="glass-card fade-in">
            <h1>ЯЗЫК / ТІЛ</h1>
            <span class="subtitle-blue">ВЫБЕРИТЕ ИНТЕРФЕЙС</span>
            
            <div style="margin-top: 30px; display: flex; flex-direction: column; gap: 5px;">
                <button class="btn btn-lang" onclick="selectLanguage('ru')">
                    <span class="flag-icon">🇷🇺</span> РУССКИЙ ЯЗЫК
                </button>
                <button class="btn btn-lang" onclick="selectLanguage('kz')">
                    <span class="flag-icon">🇰🇿</span> ҚАЗАҚ ТІЛІ
                </button>
            </div>
        </div>
    </div>

    <div id="menu-screen" class="screen hidden">
        <div class="glass-card fade-in" style="max-width: 500px;">
            <h1 id="menuTitle">МАТЕРИАЛЫ</h1>
            <span id="menuSubtitle" class="subtitle-blue" style="margin-bottom: 50px;">ВЫБЕРИТЕ ФОРМАТ</span>
            
            <div style="margin-top: 30px;">
                
                <div class="menu-section">
                    <div class="section-heading" id="headingPres">СМОТРЕТЬ ПРЕЗЕНТАЦИЮ</div>
                    <button id="btnPresentation" class="btn btn-neon-3d" onclick="openPdfViewer()">
                        СМОТРЕТЬ ПРЕЗЕНТАЦИЮ
                    </button>
                </div>

                <div class="menu-section" style="animation-delay: 0.5s; margin-top: 40px;">
                    <div class="section-heading" id="headingAI">ОБУЧЕНИЕ ПРИ ПОМОЩИ ИИ</div>
                    
                    <a id="btnAiLink" href="https://notebooklm.google.com/notebook/8c87d4fd-dea3-46de-b6d8-5cda56e6a4aa" 
                       target="_blank" 
                       class="btn btn-neon-3d">
                       ОБУЧЕНИЕ ПРИ ПОМОЩИ ИИ
                    </a>

                    <a id="btnAiVideo" href="" 
                       target="_blank" 
                       class="btn btn-neon-3d" style="margin-top: 15px; font-size: 1rem;">
                       КАК ПОЛЬЗОВАТЬСЯ ОБУЧЕНИЕМ ИИ
                    </a>
                </div>

                <button id="changeLangBtn" class="btn btn-outline" style="margin-top: 30px;" onclick="returnToLang()">
                    СМЕНИТЬ ЯЗЫК
                </button>
            </div>
            
            <div style="margin-top: 20px; font-size: 0.75rem; color: #475569;">
                Safety ALL © 2026
            </div>
        </div>
    </div>

    <div id="pdf-screen" class="screen hidden">
        <div class="pdf-container-wrapper fade-in">
            <div class="pdf-header">
                <span class="pdf-title" id="pdfTitle">Работы на высоте</span>
                <button class="close-btn" id="btnClosePdf" onclick="closePdfViewer()">Закрыть</button>
            </div>
            
            <div class="iframe-holder">
                <iframe id="presentation-frame" allow="autoplay"></iframe>
                <div class="blocker"></div>
            </div>
        </div>
    </div>

<script>
    // ===============================================
    // НАСТРОЙКИ
    // ===============================================
    const CONFIG = {
        password: "RBVsafetyall2090",
        linkRu: "https://drive.google.com/file/d/1fWGympkVabUUB0VJizWqLBIMXDCykp5d/preview",
        linkKz: "https://drive.google.com/file/d/1rzEZBAuYMTr2xAd6q2skNY8-8KWGGHjQ/preview",
        // Ссылка на видео инструкцию
        videoLink: "https://drive.google.com/file/d/1IkE_xSs4HJyKseR1KXnuUzM9_G_EDp/view?usp=sharing"
    };

    // Элементы экранов
    const loginScreen = document.getElementById('login-screen');
    const langScreen = document.getElementById('lang-screen');
    const menuScreen = document.getElementById('menu-screen');
    const pdfScreen = document.getElementById('pdf-screen');
    
    // Элементы управления
    const passInput = document.getElementById('passwordInput');
    const errorMsg = document.getElementById('errorMsg');
    const pdfFrame = document.getElementById('presentation-frame');
    
    // Элементы для перевода (текстовые)
    const changeLangBtn = document.getElementById('changeLangBtn');
    const menuTitle = document.getElementById('menuTitle');
    const menuSubtitle = document.getElementById('menuSubtitle');
    const btnPresentation = document.getElementById('btnPresentation');
    const btnAiLink = document.getElementById('btnAiLink');
    
    // НОВЫЕ элементы для перевода
    const headingPres = document.getElementById('headingPres');
    const headingAI = document.getElementById('headingAI');
    const btnAiVideo = document.getElementById('btnAiVideo');
    const pdfTitle = document.getElementById('pdfTitle');
    const btnClosePdf = document.getElementById('btnClosePdf');


    let currentPdfLink = "";

    // Инициализация: установка ссылки на видео
    btnAiVideo.href = CONFIG.videoLink;


    // 1. Вход
    function login() {
        if (passInput.value === CONFIG.password) {
            loginScreen.classList.add('hidden');
            langScreen.classList.remove('hidden');
        } else {
            showError();
        }
    }

    // 2. Выбор языка и перевод интерфейса
    function selectLanguage(lang) {
        if (lang === 'kz') {
            currentPdfLink = CONFIG.linkKz;
            
            // Перевод на Казахский
            menuTitle.innerText = "МАТЕРИАЛДАР";
            menuSubtitle.innerText = "ФОРМАТТЫ ТАҢДАҢЫЗ";
            
            headingPres.innerText = "ПРЕЗЕНТАЦИЯНЫ ҚАРАУ";
            btnPresentation.innerText = "ПРЕЗЕНТАЦИЯНЫ ҚАРАУ";
            
            headingAI.innerText = "ЖИ-МЕН ОҚЫТУ";
            btnAiLink.innerText = "ЖАСАНДЫ ИНТЕЛЛЕКТПЕН ОҚУ";
            btnAiVideo.innerText = "ЖИ ОҚЫТУДЫ ҚАЛАЙ ҚОЛДАНУ КЕРЕК";
            
            changeLangBtn.innerText = "ТІЛДІ АУЫСТЫРУ";
            pdfTitle.innerText = "Биіктіктегі жұмыстар";
            btnClosePdf.innerText = "Жабу";
            
        } else {
            currentPdfLink = CONFIG.linkRu;
            
            // Перевод на Русский (возврат)
            menuTitle.innerText = "МАТЕРИАЛЫ";
            menuSubtitle.innerText = "ВЫБЕРИТЕ ФОРМАТ";
            
            headingPres.innerText = "СМОТРЕТЬ ПРЕЗЕНТАЦИЮ";
            btnPresentation.innerText = "СМОТРЕТЬ ПРЕЗЕНТАЦИЮ";

            headingAI.innerText = "ОБУЧЕНИЕ ПРИ ПОМОЩИ ИИ";
            btnAiLink.innerText = "ОБУЧЕНИЕ ПРИ ПОМОЩИ ИИ";
            btnAiVideo.innerText = "КАК ПОЛЬЗОВАТЬСЯ ОБУЧЕНИЕМ ИИ";
            
            changeLangBtn.innerText = "СМЕНИТЬ ЯЗЫК";
            pdfTitle.innerText = "Работы на высоте";
            btnClosePdf.innerText = "Закрыть";
        }
        
        langScreen.classList.add('hidden');
        menuScreen.classList.remove('hidden');
    }

    // 3. Вернуться к выбору языка
    function returnToLang() {
        menuScreen.classList.add('hidden');
        langScreen.classList.remove('hidden');
        // Перезапуск анимации
        const card = langScreen.querySelector('.glass-card');
        card.classList.remove('fade-in');
        void card.offsetWidth; 
        card.classList.add('fade-in');
    }

    passInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') login();
    });

    function showError() {
        errorMsg.style.display = 'block';
        passInput.style.borderColor = '#f87171';
        passInput.value = '';
        setTimeout(() => {
            passInput.style.borderColor = 'rgba(255,255,255,0.1)';
        }, 2000);
    }

    function openPdfViewer() {
        pdfFrame.src = currentPdfLink;
        menuScreen.classList.add('hidden');
        pdfScreen.classList.remove('hidden');
    }

    function closePdfViewer() {
        pdfScreen.classList.add('hidden');
        menuScreen.classList.remove('hidden');
        pdfFrame.src = "";
    }
</script>

</body>
</html>
